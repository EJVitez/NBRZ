# Deploys the site (including NBRZ Forge at /studio/) to Cloudflare Pages.
# main → production URL; every other branch → its own preview URL.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
# Without those secrets this workflow skips the deploy instead of failing.
name: Cloudflare Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: nbrz
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Cloudflare secrets not set — skipping deploy. See .github/workflows/cloudflare-pages.yml"; fi

      - name: Stage site files
        if: steps.creds.outputs.ok == 'true'
        run: |
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'dist' --exclude 'package*.json' ./ dist/

      - name: Create Pages project if needed
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT" --branch="${GITHUB_REF_NAME}" --commit-dirty=true
