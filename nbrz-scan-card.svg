<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="720" viewBox="0 0 480 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f5f3ef"/>
      <stop offset="42%"  stop-color="#c9a84c"/>
      <stop offset="62%"  stop-color="#e8d99a"/>
      <stop offset="78%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#7a6530"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- grain texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="720" fill="#080808"/>

  <!-- Grain overlay -->
  <rect width="480" height="720" fill="white" filter="url(#grain)" opacity="0.035"/>

  <!-- Gold radial glow behind wordmark -->
  <ellipse cx="240" cy="130" rx="200" ry="90" fill="rgba(201,168,76,0.07)"/>

  <!-- Corner brackets -->
  <path d="M24 24 L24 56 M24 24 L56 24" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M456 24 L456 56 M456 24 L424 24" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M24 696 L24 664 M24 696 L56 696" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M456 696 L456 664 M456 696 L424 696" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="240" y="72" text-anchor="middle"
    font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
    font-size="10" font-weight="600" letter-spacing="5"
    fill="#c9a84c" opacity="0.8">NOW STREAMING</text>

  <!-- NBRZ wordmark -->
  <text x="240" y="170" text-anchor="middle"
    font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
    font-size="108" font-weight="700" letter-spacing="-2"
    fill="url(#wordGrad)" filter="url(#glow)">NBRZ</text>

  <!-- Tagline -->
  <text x="240" y="210" text-anchor="middle"
    font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="300" letter-spacing="1.5"
    fill="#7a7775">The Block Is the Studio.</text>

  <!-- Divider -->
  <line x1="80" y1="238" x2="400" y2="238" stroke="#c9a84c" stroke-width="0.5" opacity="0.25"/>

